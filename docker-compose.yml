version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopsmart-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - shopsmart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopsmart-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shopsmart-network
    restart: unless-stopped

networks:
  shopsmart-network:
    driver: bridge

volumes:
  node_modules_backend:
